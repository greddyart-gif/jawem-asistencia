<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JAWEM · Centro de Mando</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="img/icon-192.png">
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root {
      --azul: #1F3A7A; --azul-osc: #142856; --celeste: #3FA9D9; --naranja: #F24E1E;
      --verde: #1E9E5A; --ambar: #E8A317; --gris: #F3F5F9; --linea: #E1E6EF;
      --texto: #1B2333; --suave: #6B7588;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Barlow', system-ui, sans-serif; background: var(--gris); color: var(--texto); }
    .wrap { max-width: 1000px; margin: 0 auto; padding: 0 16px 30px; }

    header { background: #fff; border-bottom: 3px solid var(--naranja); }
    header .wrap { display: flex; align-items: center; gap: 14px; padding-top: 14px; padding-bottom: 14px; flex-wrap: wrap; }
    header img { height: 48px; }
    .titulo { flex: 1; min-width: 200px; }
    .titulo h1 { font-size: 22px; color: var(--azul); line-height: 1.1; }
    .titulo p { font-size: 14px; color: var(--suave); }

    .btn-gen { font-size: 14px; font-weight: 600; padding: 8px 12px; border-radius: 8px; background: var(--naranja); color: #fff; text-decoration: none; white-space: nowrap; }
    @media print { .btn-gen { display: none; } }
    .periodos { display: flex; gap: 6px; flex-wrap: wrap; }
    .periodos button {
      font-family: inherit; font-size: 14px; font-weight: 600; padding: 8px 12px; border-radius: 8px;
      border: 1.5px solid var(--linea); background: #fff; color: var(--azul); cursor: pointer;
    }
    .periodos button.activo { background: var(--azul); border-color: var(--azul); color: #fff; }

    .sub { display: flex; justify-content: space-between; align-items: center; margin: 18px 0 12px; flex-wrap: wrap; gap: 8px; }
    .sub .rango { font-size: 15px; color: var(--suave); }
    .sub .rango b { color: var(--texto); }
    .btn-imp { font-family: inherit; font-size: 14px; font-weight: 600; padding: 8px 14px; border-radius: 8px; border: 0; background: var(--naranja); color: #fff; cursor: pointer; }

    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .kpi { background: #fff; border-radius: 12px; padding: 14px 16px; box-shadow: 0 1px 3px rgba(20,40,86,.08); }
    .kpi .v { font-size: 30px; font-weight: 700; color: var(--azul-osc); line-height: 1.1; }
    .kpi .l { font-size: 13px; color: var(--suave); text-transform: uppercase; letter-spacing: .5px; }
    .kpi.ok .v { color: var(--verde); } .kpi.warn .v { color: var(--ambar); } .kpi.mal .v { color: var(--naranja); }

    .card { background: #fff; border-radius: 12px; padding: 16px; box-shadow: 0 1px 3px rgba(20,40,86,.08); margin-bottom: 16px; }
    .card h2 { font-size: 17px; color: var(--azul); margin-bottom: 10px; }

    table { width: 100%; border-collapse: collapse; font-size: 15px; }
    th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: var(--suave); font-weight: 600; padding: 6px 8px; border-bottom: 2px solid var(--linea); }
    td { padding: 10px 8px; border-bottom: 1px solid var(--linea); }
    th.n, td.n { text-align: center; }
    tr:last-child td { border-bottom: 0; }
    .nombre { font-weight: 600; }
    .pill { display: inline-block; min-width: 52px; text-align: center; padding: 3px 8px; border-radius: 20px; font-weight: 700; font-size: 14px; color: #fff; }
    .pill.ok { background: var(--verde); } .pill.warn { background: var(--ambar); } .pill.mal { background: var(--naranja); } .pill.na { background: #B9C1D0; }
    .cero { color: #B9C1D0; }
    .tabla-scroll { overflow-x: auto; }

    #mapa { height: 420px; border-radius: 10px; z-index: 0; }
    .leyenda { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 10px; font-size: 14px; color: var(--suave); }
    .leyenda span { display: inline-flex; align-items: center; gap: 6px; }
    .leyenda i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
    .nota { font-size: 13px; color: var(--suave); margin-top: 8px; }

    .hoy { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
    .hoy-p { border: 1px solid var(--linea); border-radius: 10px; padding: 10px 12px; display: flex; gap: 10px; align-items: flex-start; }
    .hoy-p .dot { width: 11px; height: 11px; border-radius: 50%; margin-top: 5px; flex-shrink: 0; }
    .hoy-p b { display: block; font-size: 15px; }
    .hoy-p span { font-size: 13px; color: var(--suave); }
    .st-EN_SITIO .dot { background: var(--verde); } .st-SALIO .dot { background: #9AA5B8; }
    .st-POR_LLEGAR .dot { background: var(--celeste); } .st-SIN_MARCAR .dot { background: var(--naranja); }
    .st-LIBRE .dot { background: #DDE2EA; } .st-SIN_MARCAR { border-color: #FBD3C4; background: #FFF8F5; }
    .wa { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; color: #fff; background: #25D366;
          padding: 4px 10px; border-radius: 6px; text-decoration: none; white-space: nowrap; }
    .motivo { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 6px; color: #fff; }
    .motivo.SIN_LLEGADA { background: var(--naranja); } .motivo.SIN_SALIDA { background: var(--ambar); }
    .horario-p { display: block; font-weight: 400; font-size: 12px; color: var(--suave); }
    @media print { .wa { display: none; } }
    .mant-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 6px; }
    @media (max-width: 700px) { .mant-grid { grid-template-columns: 1fr; } }
    .rank { list-style: none; }
    .rank li { padding: 7px 0; border-bottom: 1px solid var(--linea); }
    .rank li:last-child { border-bottom: 0; }
    .rank .t { display: flex; justify-content: space-between; gap: 8px; font-size: 15px; }
    .rank .t b { font-weight: 600; }
    .rank small { color: var(--suave); font-size: 12px; }
    .rank .bar { height: 7px; background: var(--linea); border-radius: 4px; margin-top: 5px; overflow: hidden; }
    .rank .bar i { display: block; height: 100%; background: var(--naranja); border-radius: 4px; }
    .rank li.top .t b { color: var(--naranja); }
    .dias { font-weight: 700; color: var(--naranja); }
    .tabs-cm { display: flex; gap: 6px; overflow-x: auto; margin: 4px 0 16px; padding-bottom: 2px; }
    .tabs-cm button { flex: 0 0 auto; font-family: inherit; font-size: 15px; font-weight: 600; padding: 10px 14px; border-radius: 10px;
                      border: 1.5px solid var(--linea); background: #fff; color: var(--suave); cursor: pointer; }
    .tabs-cm button.activa { background: var(--azul); border-color: var(--azul); color: #fff; }
    .tab-cm { display: none; } .tab-cm.activa { display: block; }
    .var { font-size: 13px; font-weight: 700; }
    .var.sube { color: var(--verde); } .var.baja { color: var(--naranja); }
    @media print { .tabs-cm { display: none; } .tab-cm { display: block !important; } }
    .tb-grp { margin: 0 0 14px; }
    .tb-gh { display: flex; justify-content: space-between; align-items: baseline; font-size: 15px; font-weight: 600; margin-bottom: 6px; }
    .tb-gh span { font-size: 13px; color: var(--suave); font-weight: 500; }
    .tb-ar { font-size: 12px; color: var(--suave); margin: 6px 0 4px; text-transform: uppercase; letter-spacing: .4px; }
    .tb-tiles { display: flex; flex-wrap: wrap; gap: 6px; }
    .tb-t { width: 58px; padding: 6px 0; border-radius: 8px; text-align: center; cursor: pointer; border: 2px solid transparent; }
    .tb-t b { display: block; font-size: 12px; font-weight: 700; }
    .tb-t i { font-style: normal; font-size: 13px; font-weight: 600; }
    .tb-ok { background: #E3F4EA; color: #17673F; } .tb-wa { background: #FDF1D8; color: #8A5A00; }
    .tb-ba { background: #FDE2DA; color: #B23410; } .tb-nd { background: var(--gris); color: #9AA5B8; }
    .tb-t.sel { border-color: var(--azul-osc); }
    .tb-ley { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--suave); margin-bottom: 10px; }
    .tb-ley i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 4px; }
    .tb-det { background: var(--gris); border-radius: 8px; padding: 10px 12px; font-size: 14px; color: var(--suave); margin-bottom: 14px; }
    .tb-det b { color: var(--texto); }
    @media print { .tb-t { -webkit-print-color-adjust: exact; print-color-adjust: exact; } }
    .ab-card { border: 2px solid var(--naranja); background: #FFF8F5; }
    .ab-card h2 { color: var(--naranja); display: flex; align-items: center; gap: 8px; }
    .ab-n { background: var(--naranja); color: #fff; font-size: 13px; border-radius: 12px; padding: 1px 9px; }
    .ab-fila { display: flex; gap: 12px; justify-content: space-between; background: #fff; border: 1px solid #F6D2C4; border-radius: 10px; padding: 10px 12px; margin-top: 8px; }
    .ab-izq b { font-size: 15px; } .ab-izq small { display: block; color: var(--suave); font-size: 13px; margin-top: 2px; }
    .ab-ult { font-size: 13px; margin-top: 6px; background: var(--gris); border-radius: 6px; padding: 6px 8px; }
    .ab-dias { text-align: center; min-width: 52px; } .ab-dias b { display: block; font-size: 24px; color: var(--naranja); line-height: 1; } .ab-dias span { font-size: 12px; color: var(--suave); }
    .fin-lock { text-align: center; padding: 10px 0 4px; }
    .fin-lock p { color: var(--suave); font-size: 14px; margin-bottom: 12px; }
    .fin-form { display: flex; gap: 8px; max-width: 360px; margin: 0 auto; }
    .fin-form input { flex: 1; padding: 10px 12px; border: 1.5px solid var(--linea); border-radius: 8px; font-family: inherit; font-size: 16px; }
    .btn-azul { font-family: inherit; font-size: 15px; font-weight: 600; padding: 10px 16px; border-radius: 8px; border: 0; background: var(--azul); color: #fff; cursor: pointer; }
    .fin-err { color: var(--naranja); font-size: 14px; margin-top: 8px; min-height: 18px; }
    .fin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 700px) { .fin-grid { grid-template-columns: 1fr; } }
    td.m, th.m { text-align: right; white-space: nowrap; }
    .barra { height: 8px; background: var(--linea); border-radius: 4px; overflow: hidden; margin-top: 4px; min-width: 70px; }
    .barra i { display: block; height: 100%; background: var(--celeste); }
    .sub-t { font-size: 13px; text-transform: uppercase; letter-spacing: .5px; color: var(--suave); margin: 4px 0 6px; font-weight: 600; }
    tr.total td { font-weight: 700; border-top: 2px solid var(--linea); }
    .estado { text-align: center; padding: 60px 10px; color: var(--suave); font-size: 16px; }
    .spinner { width: 36px; height: 36px; margin: 0 auto 14px; border: 4px solid var(--linea); border-top-color: var(--azul); border-radius: 50%; animation: g .9s linear infinite; }
    @keyframes g { to { transform: rotate(360deg); } }

    footer { text-align: center; padding: 6px 0 22px; opacity: .45; font-size: 11px; color: var(--suave); display: flex; align-items: center; justify-content: center; gap: 6px; }
    footer img { height: 18px; }

    @media (max-width: 640px) {
      .ocultar-movil { display: none; }
      table { font-size: 14px; }
    }
    @media print {
      body { background: #fff; }
      .periodos, .btn-imp { display: none; }
      .card, .kpi { box-shadow: none; border: 1px solid var(--linea); }
      .card { break-inside: avoid; }
      .ocultar-movil { display: table-cell; }
    }
  </style>
</head>
<body>

<header>
  <div class="wrap">
    <img src="img/jawem-logo.png" alt="JAWEM">
    <div class="titulo">
      <h1>Centro de Mando</h1>
      <p>Operaciones · Asistencia · Finanzas</p>
    </div>
    <a class="btn-gen" id="lnk-gen" href="#">📄 Reporte de generación</a>
    <div class="periodos" id="periodos">
      <button data-p="semana">Esta semana</button>
      <button data-p="mes" class="activo">Este mes</button>
      <button data-p="mesAnt">Mes anterior</button>
    </div>
  </div>
</header>

<div class="wrap">
  <div id="contenido">
    <div class="estado"><div class="spinner"></div>Cargando información…</div>
  </div>
</div>

<footer>
  <img src="img/rex-dino.png" alt="">
  <span>Desarrollado por REX Services</span>
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // ================== CONFIGURACIÓN ==================
  const API_URL = 'https://script.google.com/macros/s/AKfycbzfHKz4TKGwtL7N1c0VhZTzqXvWKnAyVpz60nkcEpuj2im0VarUhn-JTNq03Ho7dAbBsA/exec';
  // ===================================================

  const clave = new URLSearchParams(location.search).get('k') || '';
  const COLORES = ['#1F3A7A', '#F24E1E', '#1E9E5A', '#8E44AD', '#E8A317', '#3FA9D9', '#C0392B', '#16A085'];
  let mapa = null;

  const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const fmt = s => {
    const [y, m, d] = s.split('-').map(Number);
    return new Date(y, m - 1, d).toLocaleDateString('es-GT', { day: 'numeric', month: 'long', year: 'numeric' });
  };
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  function rango(p) {
    const hoy = new Date();
    if (p === 'semana') {
      const dow = hoy.getDay() === 0 ? 7 : hoy.getDay();
      const lunes = new Date(hoy); lunes.setDate(hoy.getDate() - dow + 1);
      return { desde: iso(lunes), hasta: iso(hoy) };
    }
    if (p === 'mesAnt') {
      const ini = new Date(hoy.getFullYear(), hoy.getMonth() - 1, 1);
      const fin = new Date(hoy.getFullYear(), hoy.getMonth(), 0);
      return { desde: iso(ini), hasta: iso(fin) };
    }
    return { desde: iso(new Date(hoy.getFullYear(), hoy.getMonth(), 1)), hasta: iso(hoy) };
  }

  const claseP = v => v === null ? 'na' : v >= 90 ? 'ok' : v >= 75 ? 'warn' : 'mal';
  const num = (v, suf) => v ? v + (suf || '') : '<span class="cero">0</span>';

  async function cargar(p) {
    document.querySelectorAll('#periodos button').forEach(b => b.classList.toggle('activo', b.dataset.p === p));
    const c = $('contenido');
    c.innerHTML = '<div class="estado"><div class="spinner"></div>Cargando información…</div>';

    if (API_URL.startsWith('PEGA_AQUI')) { c.innerHTML = '<div class="estado">Falta configurar API_URL.</div>'; return; }
    if (!clave) { c.innerHTML = '<div class="estado">Enlace incompleto: falta la clave de acceso.</div>'; return; }

    const r = rango(p);
    try {
      const url = API_URL + '?accion=reporte&k=' + encodeURIComponent(clave) + '&desde=' + r.desde + '&hasta=' + r.hasta;
      const d = await (await fetch(url)).json();
      if (!d.ok) { c.innerHTML = '<div class="estado">' + esc(d.error || 'No se pudo cargar el reporte.') + '</div>'; return; }
      pintar(d);
    } catch (e) {
      c.innerHTML = '<div class="estado">Sin conexión. Intenta de nuevo.</div>';
    }
  }

  function pintar(d) {
    const k = d.kpis;

    const filas = d.tecnicos.map(t => `
      <tr>
        <td class="nombre">${esc(t.nombre)}<span class="horario-p">${esc(t.horario || '')}</span></td>
        <td class="n"><span class="pill ${claseP(t.puntualidad)}">${t.puntualidad === null ? '—' : t.puntualidad + '%'}</span></td>
        <td class="n">${t.diasTrabajados}/${t.diasLaborales}</td>
        <td class="n">${t.tardanzas ? t.tardanzas + ' <small style="color:var(--suave)">(' + t.minTarde + ' min)</small>' : num(0)}</td>
        <td class="n">${num(t.ausencias)}</td>
        <td class="n ocultar-movil">${t.llegadaPromedio || '—'}</td>
        <td class="n ocultar-movil">${t.salidaPromedio || '—'}</td>
        <td class="n ocultar-movil">${num(t.salidasAnticipadas)}</td>
        <td class="n ocultar-movil">${t.horasSitio ? t.horasSitio + ' h' : num(0)}</td>
      </tr>`).join('');

    const wa = (tel, texto) => tel
      ? `<a class="wa" target="_blank" rel="noopener" href="https://wa.me/${tel}?text=${encodeURIComponent(texto)}">WhatsApp</a>` : '';
    const fCorta = f => { const [y, m, dd] = f.split('-'); return dd + '/' + m; };
    const nombre1 = n => String(n).split(' ')[0];

    const ESTADOS = {
      EN_SITIO: p => `En sitio · ${esc(p.detalle)} desde ${p.hora}`,
      SALIO: p => `Salió ${p.hora} · ${esc(p.detalle)}`,
      POR_LLEGAR: p => `Por llegar · ${esc(p.detalle)}`,
      SIN_MARCAR: p => `No ha marcado · ${esc(p.detalle)}`,
      LIBRE: p => 'Día no laboral'
    };
    const verHoy = d.hoy && d.periodo.hasta === d.hoy.fecha;
    const hoyHtml = verHoy ? `
      <div class="card">
        <h2>Hoy · ${fmt(d.hoy.fecha)}</h2>
        <div class="hoy">${d.hoy.personas.map(p => `
          <div class="hoy-p st-${p.estado}">
            <i class="dot"></i>
            <div><b>${esc(p.nombre)}</b><span>${ESTADOS[p.estado](p)}</span>
            </div>
          </div>`).join('')}
        </div>
      </div>` : '';

    const MOTIVO = { SIN_LLEGADA: 'No ha marcado llegada', SIN_SALIDA: 'No ha marcado salida' };
    const pend = d.pendientes || [];
    const pendHtml = `
      <div class="card">
        <h2>Pendientes de hoy</h2>
        ${pend.length ? `<div class="tabla-scroll"><table>
          <thead><tr><th>Persona</th><th>Motivo</th><th class="ocultar-movil">Detalle</th><th class="n">Consultar</th></tr></thead>
          <tbody>${pend.map(x => `
            <tr>
              <td class="nombre">${esc(x.nombre)}</td>
              <td><span class="motivo ${x.motivo}">${MOTIVO[x.motivo]}</span></td>
              <td class="ocultar-movil" style="color:var(--suave);font-size:14px">${esc(x.detalle || '')}</td>
              <td class="n">${wa(x.telefono, x.motivo === 'SIN_LLEGADA'
                ? 'Hola ' + nombre1(x.nombre) + ', no tenemos registrada tu llegada de hoy. ¿Nos puedes indicar el motivo?'
                : 'Hola ' + nombre1(x.nombre) + ', no tenemos registrada tu salida de hoy. ¿Ya terminaste tu jornada?')}</td>
            </tr>`).join('')}
          </tbody></table></div>`
        : '<p class="cero" style="padding:6px 0">Todo en orden hoy. 👍</p>'}
      </div>`;


    // ---------- Mantenimiento ----------
    const m = d.mantenimiento;
    let mantHtml = '';
    if (m) {
      const maxF = Math.max(1, ...m.lugares.map(l => l.fallas));
      const lugaresHtml = m.lugares.length ? m.lugares.slice(0, 6).map((l, i) => `
        <li class="${i === 0 && l.fallas ? 'top' : ''}">
          <div class="t"><b>${i === 0 && l.fallas ? '⚠ ' : ''}${esc(l.nombre)}</b><span>${l.fallas} falla${l.fallas === 1 ? '' : 's'}</span></div>
          <small>${esc(l.cliente)} · ${l.trabajos} trabajo${l.trabajos === 1 ? '' : 's'} · ${l.horas} h-h</small>
          <div class="bar"><i style="width:${Math.round(l.fallas / maxF * 100)}%"></i></div>
        </li>`).join('') : '<li class="cero">Sin trabajos en el período.</li>';

      const maxE = Math.max(1, ...m.equipos.map(e => e.fallas));
      const equiposHtml = m.equipos.length ? m.equipos.map(e => `
        <li>
          <div class="t"><b>${esc(e.equipo)}</b><span>${e.fallas}</span></div>
          <small>en ${e.lugares} lugar${e.lugares === 1 ? '' : 'es'}</small>
          <div class="bar"><i style="width:${Math.round(e.fallas / maxE * 100)}%"></i></div>
        </li>`).join('') : '<li class="cero">Sin fallas (correctivos) en el período.</li>';

      const pendHtmlM = m.pendientes.length ? m.pendientes.map(p => `
          <div class="ab-fila">
            <div class="ab-izq">
              <b>${esc(p.id)} · ${esc(p.sitio)}</b>
              <small>${esc(p.equipo)}${p.ident ? ' · ' + esc(p.ident) : ''} · Abrió ${esc(p.tecnico)} el ${fCorta(p.fecha)}${p.visitas > 1 ? ' · ' + p.visitas + ' visitas' : ''}</small>
              ${p.ultimaDesc ? `<div class="ab-ult">Último avance (${esc(p.ultimoTecnico)}, ${fCorta(p.ultimaFecha)}): ${esc(p.ultimaDesc)}</div>` : ''}
            </div>
            <div class="ab-dias"><b>${p.dias}</b><span>día${p.dias === 1 ? '' : 's'}</span></div>
          </div>`).join('') + (m.totalPendientes > m.pendientes.length ? `<p class="nota">Y ${m.totalPendientes - m.pendientes.length} más.</p>` : '')
        : '<p class="cero" style="padding:4px 0">No hay OT abiertas. 👍</p>';

      // Aprovechamiento: horas en trabajos reportados vs. horas en sitio (asistencia)
      const sitioPorNombre = {};
      d.tecnicos.forEach(t => sitioPorNombre[t.nombre] = t.horasSitio);
      const personasHtml = m.personas.sort((a, b) => b.horas - a.horas).map(p => {
        const hs = sitioPorNombre[p.nombre];
        const ap = hs ? Math.min(100, Math.round(p.horas / hs * 100)) : null;
        return `<tr><td>${esc(p.nombre)}</td><td class="n">${p.trabajos}</td><td class="n">${p.horas} h</td>
                <td class="n">${ap === null ? '—' : ap + '%'}</td></tr>`;
      }).join('');

      mantHtml = `
      <div class="card ab-card">
        <h2>📂 Órdenes de trabajo abiertas <span class="ab-n">${m.totalPendientes}</span></h2>
        ${pendHtmlM}
        <p class="nota">Una OT queda abierta cuando su último reporte dice “Queda pendiente”. Se cierra cuando un técnico la continúa desde la app y la marca como resuelta.</p>
      </div>

      <div class="card">
        <h2>🛠 Mantenimiento</h2>
        <div class="kpis" style="margin-bottom:10px;">
          <div class="kpi"><div class="v">${m.trabajos}</div><div class="l">Trabajos</div></div>
          <div class="kpi ${m.correctivos ? 'warn' : ''}"><div class="v">${m.correctivos}</div><div class="l">Fallas atendidas</div></div>
          <div class="kpi"><div class="v">${m.horasHombre}</div><div class="l">Horas-hombre</div></div>
          <div class="kpi ${m.pctPreventivo === null ? '' : m.pctPreventivo >= 40 ? 'ok' : 'warn'}"><div class="v">${m.pctPreventivo === null ? '—' : m.pctPreventivo + '%'}</div><div class="l">Preventivo</div></div>
          <div class="kpi ${m.totalPendientes ? 'mal' : 'ok'}"><div class="v">${m.totalPendientes}</div><div class="l">OT abiertas</div></div>
          <div class="kpi"><div class="v">${m.diasCierre === null ? '—' : m.diasCierre}</div><div class="l">Días promedio para cerrar${m.cerradas ? ' (' + m.cerradas + ')' : ''}</div></div>
        </div>

        <div class="mant-grid">
          <div><div class="sub-t">Lugares con más fallas</div><ul class="rank">${lugaresHtml}</ul></div>
          <div><div class="sub-t">Equipos que más fallan</div><ul class="rank">${equiposHtml}</ul></div>
        </div>


        <div class="mant-grid" style="margin-top:18px;">
          <div>
            <div class="sub-t">Horas por cliente</div>
            <table><tbody>${m.clientes.map(c => `<tr><td>${esc(c.cliente)}</td><td class="n">${c.trabajos} trab.</td><td class="m">${c.horasHombre} h-h</td></tr>`).join('') || '<tr><td class="cero">—</td></tr>'}</tbody></table>
          </div>
          <div>
            <div class="sub-t">Por persona</div>
            <table><thead><tr><th>Persona</th><th class="n">Trab.</th><th class="n">Horas</th><th class="n">Aprov.</th></tr></thead>
            <tbody>${personasHtml || '<tr><td colspan="4" class="cero">—</td></tr>'}</tbody></table>
          </div>
        </div>
        <p class="nota">Falla = trabajo correctivo. Horas-hombre = duración × personas que participaron. Aprov. = horas en trabajos reportados ÷ horas en sitio según asistencia.
        Días para cerrar: desde que se abrió la OT hasta el reporte que la cerró.</p>
      </div>`;
    }


    // ---------- Generación ----------
    const g = d.generacion;
    let genHtml = '<div class="card"><p class="cero">Aún no hay lecturas de inversores.</p></div>';
    if (g) {
      const kw = n => Number(n || 0).toLocaleString('es-GT', { maximumFractionDigits: 0 });
      const varTxt = v => v === null ? '<span class="cero">—</span>' : `<span class="var ${v >= 0 ? 'sube' : 'baja'}">${v >= 0 ? '▲' : '▼'} ${Math.abs(v)}%</span>`;
      // Gráfica diaria (SVG)
      const W = 900, H = 170, pl = 52, pb = 22, pt = 10;
      const vals = g.dias.map(x => x.kwh);
      const max = Math.max(1, ...vals.filter(v => v !== null));
      const bw = (W - pl - 8) / Math.max(1, g.dias.length);
      let svg = '';
      [0, .5, 1].forEach(f => {
        const y = pt + (H - pt - pb) * (1 - f);
        svg += `<line x1="${pl}" x2="${W - 8}" y1="${y}" y2="${y}" stroke="#E1E6EF"/><text x="${pl - 6}" y="${y + 4}" font-size="11" fill="#6B7588" text-anchor="end">${kw(max * f)}</text>`;
      });
      const paso = g.dias.length > 16 ? Math.ceil(g.dias.length / 16) : 1;
      g.dias.forEach((x, i) => {
        const X = pl + i * bw;
        if (x.kwh !== null) {
          const h = (H - pt - pb) * x.kwh / max;
          svg += `<rect x="${X + bw * .15}" y="${H - pb - h}" width="${bw * .7}" height="${h}" rx="2" fill="#3FA9D9"><title>${x.fecha}: ${kw(x.kwh)} kWh</title></rect>`;
        }
        if (i % paso === 0) svg += `<text x="${X + bw / 2}" y="${H - 6}" font-size="11" fill="#6B7588" text-anchor="middle">${x.fecha.slice(8)}</text>`;
      });

      const r2 = n => Number(n).toLocaleString('es-GT', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      const claseR = r => r === null || !g.rendimiento ? '' : r >= g.rendimiento * 0.9 ? 'ok' : r >= g.rendimiento * 0.75 ? 'warn' : 'mal';
      const lugaresG = g.lugares.slice().sort((a, b) => (b.rendimiento || 0) - (a.rendimiento || 0)).map(L => `
        <tr><td>${esc(L.nombre)}<br><small style="color:var(--suave)">${L.inversores} inv. · ${L.capacidad ? kw(L.capacidad) + ' kW' : 'sin capacidad'}${L.sinCapacidad && L.capacidad ? ' (' + L.sinCapacidad + ' sin dato)' : ''}</small></td>
        <td class="m"><b>${kw(L.total)}</b></td>
        <td class="m">${L.promedio === null ? '—' : kw(L.promedio)}</td>
        <td class="n">${L.rendimiento === null ? '<span class="cero">—</span>' : `<span class="pill ${claseR(L.rendimiento)}">${r2(L.rendimiento)}</span>`}</td>
        <td class="n">${varTxt(L.variacion)}</td></tr>`).join('');

      const bajosG = g.bajoRendimiento.length ? g.bajoRendimiento.map(b => `
        <li><div class="t"><b>${esc(b.lugar)} · ${b.area ? esc(b.area) + ' · ' : ''}#${b.numero}</b><span>${b.pct}%</span></div>
        <small>${b.porKw
          ? r2(b.rendimiento) + ' kWh/kW·día (' + kw(b.promedio) + ' kWh/día, ' + kw(b.capacidad) + ' kW) vs. ' + r2(b.referencia) + ' de sus vecinos'
          : 'Promedio ' + kw(b.promedio) + ' kWh/día vs. ' + kw(b.referencia) + ' de sus vecinos'}</small>
        <div class="bar"><i style="width:${b.pct}%"></i></div></li>`).join('')
        : '<li class="cero">Ningún inversor por debajo del 85 % de sus vecinos. 👍</li>';

      const sinG = g.sinLectura.length ? g.sinLectura.map(x => `
        <li><div class="t"><b>${esc(x.lugar)} · ${x.area ? esc(x.area) + ' · ' : ''}#${x.numero}</b>
        <span>${x.leidos === 0 ? 'Sin lecturas' : x.noLeidos + ' día' + (x.noLeidos === 1 ? '' : 's') + ' N/L'}</span></div></li>`).join('')
        + (g.totalSinLectura > g.sinLectura.length ? `<li class="cero">Y ${g.totalSinLectura - g.sinLectura.length} más.</li>` : '')
        : '<li class="cero">Todos los inversores tienen lectura. 👍</li>';

      // Tablero de inversores
      const P = g.rendimiento;
      const clsT = y => y === null || !P ? 'tb-nd' : y >= P * 0.9 ? 'tb-ok' : y >= P * 0.75 ? 'tb-wa' : 'tb-ba';
      const porLug = {};
      (g.tablero || []).forEach(t => (porLug[t.lugar] = porLug[t.lugar] || []).push(t));
      let tabHtml = '';
      Object.keys(porLug).forEach(L => {
        const rs = porLug[L];
        let kwh = 0, kwc = 0;
        rs.forEach(r => { if (r.promedio !== null && r.capacidad) { kwh += r.promedio; kwc += r.capacidad; } });
        tabHtml += `<div class="tb-grp"><div class="tb-gh">${esc(L)}<span>${kwc ? r2(kwh / kwc) + ' kWh/kW·día' : 'sin lectura'}</span></div>`;
        let area = null;
        rs.forEach((r, i) => {
          if (r.area !== area || i === 0) {
            if (i > 0) tabHtml += '</div>';
            if (r.area) tabHtml += `<div class="tb-ar">${esc(r.area)}</div>`;
            tabHtml += '<div class="tb-tiles">';
            area = r.area;
          }
          const idx = g.tablero.indexOf(r);
          tabHtml += `<div class="tb-t ${clsT(r.rendimiento)}" data-i="${idx}"><b>#${r.numero}</b><i>${r.rendimiento === null ? '—' : r.rendimiento.toFixed(1)}</i></div>`;
        });
        tabHtml += '</div></div>';
      });

      genHtml = `
      <div class="kpis">
        <div class="kpi"><div class="v">${kw(g.total)}</div><div class="l">kWh generados ${g.variacion === null ? '' : varTxt(g.variacion)}</div></div>
        <div class="kpi"><div class="v">${g.promedioDiario === null ? '—' : kw(g.promedioDiario)}</div><div class="l">kWh promedio por día</div></div>
        <div class="kpi"><div class="v">${kw(g.capacidad)}</div><div class="l">kW instalados</div></div>
        <div class="kpi"><div class="v">${g.rendimiento === null ? '—' : r2(g.rendimiento)}</div><div class="l">kWh por kW al día</div></div>
        <div class="kpi ${g.cobertura === null ? '' : g.cobertura >= 95 ? 'ok' : g.cobertura >= 80 ? 'warn' : 'mal'}"><div class="v">${g.cobertura === null ? '—' : g.cobertura + '%'}</div><div class="l">Lecturas completas</div></div>
        <div class="kpi ${g.bajoRendimiento.length ? 'warn' : 'ok'}"><div class="v">${g.bajoRendimiento.length}</div><div class="l">Inversores bajo rendimiento</div></div>
        <div class="kpi ${g.totalSinLectura ? 'mal' : 'ok'}"><div class="v">${g.totalSinLectura}</div><div class="l">Inversores sin lectura</div></div>
      </div>

      <div class="card">
        <h2>Tablero de inversores</h2>
        <div class="tb-ley">
          <span><i class="tb-ok"></i>Bien</span><span><i class="tb-wa"></i>Un poco abajo</span>
          <span><i class="tb-ba"></i>Revisar</span><span><i class="tb-nd" style="border:1px solid var(--linea)"></i>Sin lectura</span>
        </div>
        <div class="tb-det" id="tb-det">Toca un inversor para ver su detalle. Promedio general: ${P ? r2(P) + ' kWh/kW·día' : '—'}.</div>
        <div id="tb-tablero">${tabHtml || '<p class="cero">Sin inversores registrados.</p>'}</div>
        <p class="nota">Cada cuadro es un inversor con su rendimiento (kWh por kW al día). Verde: cerca o arriba del promedio general; amarillo: 10–25 % abajo; rojo: más de 25 % abajo.</p>
      </div>

      <div class="card">
        <h2>Generación diaria (kWh)</h2>
        <svg viewBox="0 0 ${W} ${H}" width="100%">${svg}</svg>
      </div>

      <div class="card">
        <h2>Por lugar</h2>
        <div class="tabla-scroll"><table>
          <thead><tr><th>Lugar</th><th class="m">Total kWh</th><th class="m">Prom. diario</th><th class="n">kWh/kW·día</th><th class="n">vs. período anterior</th></tr></thead>
          <tbody>${lugaresG}</tbody>
        </table></div>
      </div>

      <div class="card">
        <div class="mant-grid">
          <div><div class="sub-t">⚠ Inversores con bajo rendimiento</div><ul class="rank">${bajosG}</ul></div>
          <div><div class="sub-t">Inversores sin lectura</div><ul class="rank">${sinG}</ul></div>
        </div>
        <p class="nota">kWh/kW·día = energía generada por cada kW instalado al día (permite comparar lugares de distinto tamaño). Verde: cerca o arriba del promedio general; ámbar y naranja: por debajo.
        ${g.inversoresSinCapacidad ? g.inversoresSinCapacidad + ' inversor(es) sin capacidad registrada no entran en este cálculo. ' : ''}<br>
        Bajo rendimiento: el inversor rinde menos del 85 % que los demás de su mismo lugar y área (comparado por kW cuando hay capacidad), que reciben el mismo sol.
        Puede indicar suciedad, sombra o una falla. “vs. período anterior” compara con el mismo número de días previos.</p>
        <p style="margin-top:10px;"><a class="btn-gen" href="generacion.html?k=${encodeURIComponent(clave)}" target="_blank">📄 Reporte para el cliente</a></p>
      </div>`;
    }

    const clientesHtml = d.clientes.map((cl, i) =>
      `<span><i style="background:${COLORES[i % COLORES.length]}"></i>${esc(cl.nombre)} · ${cl.sitios} sitio${cl.sitios === 1 ? '' : 's'}</span>`
    ).join('') + '<span><i style="background:#6B7588"></i>JAWEM (base y bodegas)</span>';

    $('contenido').innerHTML = `
      <div class="sub">
        <div class="rango">Del <b>${fmt(d.periodo.desde)}</b> al <b>${fmt(d.periodo.hasta)}</b> · Horario ${esc(d.horario)}</div>
        <button class="btn-imp" onclick="window.print()">Imprimir / PDF</button>
      </div>

      <div class="tabs-cm" id="tabs-cm">
        <button data-t="personal">👥 Personal</button>
        <button data-t="mant">🛠 Mantenimiento</button>
        <button data-t="gen">⚡ Generación</button>
        <button data-t="mapa">🗺 Clientes</button>
        <button data-t="fin">💰 Finanzas</button>
      </div>

      <div class="tab-cm" id="tc-personal">
      <div class="kpis">
        <div class="kpi ${claseP(k.puntualidad)}"><div class="v">${k.puntualidad === null ? '—' : k.puntualidad + '%'}</div><div class="l">Puntualidad</div></div>
        <div class="kpi ${k.tardanzas ? 'warn' : ''}"><div class="v">${k.tardanzas}</div><div class="l">Tardanzas</div></div>
        <div class="kpi ${k.ausencias ? 'mal' : ''}"><div class="v">${k.ausencias}</div><div class="l">Ausencias</div></div>
        <div class="kpi"><div class="v">${k.horasSitio}</div><div class="l">Horas en sitio</div></div>
        <div class="kpi"><div class="v">${k.sitiosAtendidos}</div><div class="l">Sitios atendidos</div></div>
      </div>

      ${hoyHtml}

      <div class="card">
        <h2>Asistencia por persona</h2>
        <div class="tabla-scroll">
          <table>
            <thead><tr>
              <th>Persona</th><th class="n">Puntualidad</th><th class="n">Días</th><th class="n">Tardanzas</th>
              <th class="n">Ausencias</th><th class="n ocultar-movil">Llegada prom.</th><th class="n ocultar-movil">Salida prom.</th>
              <th class="n ocultar-movil">Salidas antic.</th><th class="n ocultar-movil">En sitio</th>
            </tr></thead>
            <tbody>${filas || '<tr><td colspan="9" class="cero">Sin técnicos activos.</td></tr>'}</tbody>
          </table>
        </div>
        <p class="nota">Días = días trabajados / días laborales. Tardanza: llegada después de la tolerancia de su horario. Salida prom.: hora promedio de su última salida del día.</p>
      </div>

      ${verHoy ? pendHtml : ''}

      </div>

      <div class="tab-cm" id="tc-mant">
        ${mantHtml || '<div class="card"><p class="cero">Aún no hay reportes de trabajo en el período.</p></div>'}
      </div>

      <div class="tab-cm" id="tc-gen">
        ${genHtml}
      </div>

      <div class="tab-cm" id="tc-mapa">
      <div class="card">
        <h2>Mapa de clientes y sitios</h2>
        <div id="mapa"></div>
        <div class="leyenda">${clientesHtml}</div>
        ${d.sitiosSinCoordenadas > 0 ? `<p class="nota">${d.sitiosSinCoordenadas} sitio(s) de clientes aún sin coordenadas, no aparecen en el mapa.</p>` : ''}
      </div>

      </div>

      <div class="tab-cm" id="tc-fin">
      <div class="card" id="card-fin">
        <h2>💰 Parte financiera · Compras de proyectos</h2>
        <div id="fin-cuerpo"></div>
      </div>
      </div>`;

    document.querySelectorAll('#tb-tablero .tb-t').forEach(t => t.addEventListener('click', () => {
      document.querySelectorAll('#tb-tablero .tb-t').forEach(x => x.classList.remove('sel'));
      t.classList.add('sel');
      const r = d.generacion.tablero[Number(t.dataset.i)];
      const P = d.generacion.rendimiento;
      const n2 = x => Number(x).toLocaleString('es-GT', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      $('tb-det').innerHTML = `<b>${esc(r.lugar)}${r.area ? ' · ' + esc(r.area) : ''} · #${r.numero}</b><br>` +
        (r.promedio === null ? 'Sin lecturas en el período.' :
          `Capacidad ${r.capacidad ? r.capacidad + ' kW' : 'sin dato'} · Promedio ${Number(r.promedio).toLocaleString('es-GT')} kWh/día · ${r.dias} día(s) leído(s)` +
          (r.rendimiento === null ? '' : ` · Rendimiento <b>${n2(r.rendimiento)}</b> kWh/kW·día (${Math.round(r.rendimiento / P * 100)} % del promedio general)`));
    }));
    document.querySelectorAll('#tabs-cm button').forEach(b => b.addEventListener('click', () => verTabCM(b.dataset.t)));
    verTabCM(tabActual);

    pintarMapa(d);
    abrirFinanzas();
  }

  // ---------- Pestañas del Centro de Mando ----------
  let tabActual = (() => { try { return sessionStorage.getItem('jawem_tab_cm') || 'personal'; } catch (_) { return 'personal'; } })();
  function verTabCM(t) {
    tabActual = t;
    try { sessionStorage.setItem('jawem_tab_cm', t); } catch (_) {}
    document.querySelectorAll('#tabs-cm button').forEach(b => b.classList.toggle('activa', b.dataset.t === t));
    document.querySelectorAll('.tab-cm').forEach(x => x.classList.toggle('activa', x.id === 'tc-' + t));
    if (t === 'mapa' && mapa) setTimeout(() => { mapa.invalidateSize(); if (mapa._ajuste) mapa._ajuste(); }, 50);
  }

  // ---------- Parte financiera ----------
  const Q = n => 'Q ' + Number(n || 0).toLocaleString('es-GT', { minimumFractionDigits: 0, maximumFractionDigits: 0 });

  function abrirFinanzas() {
    let guardada = '';
    try { guardada = sessionStorage.getItem('jawem_fin') || ''; } catch (_) {}
    if (guardada) return cargarFinanzas(guardada);
    $('fin-cuerpo').innerHTML = `
      <div class="fin-lock">
        <p>🔒 Esta sección requiere clave.</p>
        <button class="btn-azul" id="btn-fin-ver">Ver parte financiera</button>
      </div>`;
    $('btn-fin-ver').onclick = pedirClave;
  }

  function pedirClave() {
    $('fin-cuerpo').innerHTML = `
      <div class="fin-lock">
        <p>Ingresa la clave de la parte financiera.</p>
        <form class="fin-form" id="fin-form">
          <input type="password" id="fin-clave" placeholder="Clave" autocomplete="current-password" autofocus>
          <button class="btn-azul" type="submit">Entrar</button>
        </form>
        <div class="fin-err" id="fin-err"></div>
      </div>`;
    $('fin-form').onsubmit = e => { e.preventDefault(); const c = $('fin-clave').value.trim(); if (c) cargarFinanzas(c); };
    setTimeout(() => $('fin-clave') && $('fin-clave').focus(), 50);
  }

  async function cargarFinanzas(clave) {
    $('fin-cuerpo').innerHTML = '<div class="estado" style="padding:30px 0"><div class="spinner"></div>Cargando información financiera…</div>';
    try {
      const r = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ accion: 'finanzas', clave: clave })
      });
      const d = await r.json();
      if (!d.ok) {
        try { sessionStorage.removeItem('jawem_fin'); } catch (_) {}
        pedirClave();
        $('fin-err').textContent = d.error || 'No se pudo cargar.';
        return;
      }
      try { sessionStorage.setItem('jawem_fin', clave); } catch (_) {}
      pintarFinanzas(d);
    } catch (e) {
      pedirClave();
      $('fin-err').textContent = 'Sin conexión. Intenta de nuevo.';
    }
  }

  function pintarFinanzas(d) {
    const r = d.resumen;
    const pctPag = r.comprado ? Math.round(r.pagado / r.comprado * 100) : 0;

    const filasProy = d.proyectos.map(p => `
      <tr>
        <td><span class="nombre">${esc(p.nombre)}</span><br><small style="color:var(--suave)">${esc(p.bodega)}</small></td>
        <td class="m">${Q(p.proyectado)}</td>
        <td class="m">${p.cargado ? Q(p.cargado) : '<span class="cero">—</span>'}
          <div class="barra"><i style="width:${Math.min(p.avance || 0, 100)}%"></i></div></td>
        <td class="n">${p.avance === null ? '—' : p.avance + '%'}</td>
      </tr>`).join('');

    const filasBod = d.bodegas.map(b => `<tr><td>${esc(b.bodega)}</td><td class="m">${Q(b.comprado)}</td></tr>`).join('');
    const totBod = d.bodegas.reduce((a, b) => a + b.comprado, 0);

    const filasDeuda = d.deuda.length
      ? d.deuda.map(x => `<tr><td>${esc(x.proveedor)}<br><small style="color:var(--suave)">${x.ocs.join(', ')}</small></td><td class="m">${Q(x.saldo)}</td></tr>`).join('')
      : '<tr><td colspan="2" class="cero">Sin saldos pendientes.</td></tr>';

    $('fin-cuerpo').innerHTML = `
      <div class="kpis" style="margin-bottom:14px;">
        <div class="kpi"><div class="v">${Q(r.proyectado)}</div><div class="l">Proyección de gasto</div></div>
        <div class="kpi"><div class="v">${Q(r.comprado)}</div><div class="l">Comprado (${r.ordenes} OC)</div></div>
        <div class="kpi ok"><div class="v">${Q(r.pagado)}</div><div class="l">Pagado · ${pctPag}%</div></div>
        <div class="kpi ${r.saldo > 0 ? 'mal' : ''}"><div class="v">${Q(r.saldo)}</div><div class="l">Se debe</div></div>
      </div>

      <div class="sub-t">Por proyecto · proyectado vs. cargado a obra</div>
      <div class="tabla-scroll">
        <table>
          <thead><tr><th>Proyecto</th><th class="m">Proyectado</th><th class="m">Cargado</th><th class="n">Avance</th></tr></thead>
          <tbody>${filasProy}
            <tr class="total"><td>Total</td><td class="m">${Q(r.proyectado)}</td><td class="m">${Q(r.cargado)}</td>
              <td class="n">${r.proyectado ? Math.round(r.cargado / r.proyectado * 100) + '%' : '—'}</td></tr>
          </tbody>
        </table>
      </div>

      <div class="fin-grid" style="margin-top:16px;">
        <div>
          <div class="sub-t">Comprado por bodega</div>
          <table><tbody>${filasBod}<tr class="total"><td>Total</td><td class="m">${Q(totBod)}</td></tr></tbody></table>
        </div>
        <div>
          <div class="sub-t">Saldo pendiente por proveedor</div>
          <table><tbody>${filasDeuda}</tbody></table>
        </div>
      </div>

      <p class="nota">Proyectado = requerimiento × último costo adjudicado. Cargado = salidas de bodega a cada proyecto, menos devoluciones.
      Comprado y saldo según órdenes de compra vigentes (sin anuladas). Montos con IVA. Actualizado ${esc(d.actualizado)}.
      ${d.aviso ? '<br>⚠ ' + esc(d.aviso) : ''}</p>
      <p style="text-align:right;margin-top:6px;"><a href="#" id="fin-salir" style="color:var(--suave);font-size:13px;">Ocultar parte financiera</a></p>`;

    $('fin-salir').onclick = e => {
      e.preventDefault();
      try { sessionStorage.removeItem('jawem_fin'); } catch (_) {}
      abrirFinanzas();
    };
  }

  function pintarMapa(d) {
    if (mapa) { mapa.remove(); mapa = null; }
    mapa = L.map('mapa', { scrollWheelZoom: false });
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18, attribution: '&copy; OpenStreetMap'
    }).addTo(mapa);

    const colorCliente = {};
    d.clientes.forEach((c, i) => colorCliente[c.id] = COLORES[i % COLORES.length]);
    const nombreCliente = {};
    d.clientes.forEach(c => nombreCliente[c.id] = c.nombre);

    const puntos = [];
    d.sitios.forEach(s => {
      const color = s.cliente ? (colorCliente[s.cliente] || '#6B7588') : '#6B7588';
      const radio = 8 + Math.min(s.visitas, 20) * 0.6;
      L.circleMarker([s.lat, s.lng], {
        radius: radio, color: '#fff', weight: 2, fillColor: color, fillOpacity: .9
      }).addTo(mapa).bindPopup(
        `<b>${esc(s.nombre)}</b><br>${esc(s.cliente ? (nombreCliente[s.cliente] || s.cliente) : 'JAWEM')}` +
        (s.tipo ? ' · ' + esc(s.tipo) : '') +
        `<br>Visitas en el período: <b>${s.visitas}</b>` +
        (s.fallas ? `<br>Fallas en el período: <b style="color:#F24E1E">${s.fallas}</b>` : '')
      );
      puntos.push([s.lat, s.lng]);
    });

    mapa._ajuste = () => {
      if (puntos.length) mapa.fitBounds(puntos, { padding: [40, 40], maxZoom: 13 });
      else mapa.setView([14.3, -89.8], 9);
    };
    mapa._ajuste();
  }

  function $(id) { return document.getElementById(id); }

  $('lnk-gen').href = 'generacion.html?k=' + encodeURIComponent(clave);
  $('lnk-gen').target = '_blank';
  document.querySelectorAll('#periodos button').forEach(b => b.addEventListener('click', () => cargar(b.dataset.p)));
  cargar('mes');
</script>
</body>
</html>
